[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sculptor"
version = "2.0.0b0"
description = "Modeling and MCMC fitting of (electromagnetic) astronomical spectra"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["license.md"]
authors = [
    { name = "Jan-Torge Schindler", email = "schindler@hs.uni-hamburg.de" }
]
requires-python = ">=3.13"
keywords = ["Sculptor", "astronomy", "spectroscopy", "modeling", "fitting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "pandas",
    "tqdm",
    "emcee",
    "extinction",
    "speconed",
    "chainconsumer",
    "numba>=0.67.0",
    "tol-colors>=2.2.0",
]

[project.urls]
Homepage = "http://github.com/jtschindler/sculptor"
"Bug Tracker" = "http://github.com/jtschindler/sculptor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Runtime data read by sculptor_extensions via
# importlib.resources.files("sculptor") / "data". The example spectra
# (~20 MB) stay in the repository only and are not packaged.
sculptor = ["data/iron_templates/*", "data/wave_2.txt"]

[tool.uv.workspace]
members = ["sculptor_extensions"]

[tool.uv.sources]
sculptor-extensions = { workspace = true }

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "prek>=0.5.6",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "sculptor-extensions",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/ground_truth"]

[tool.ruff]
extend-exclude = ["tests/ground_truth", "_ground_truth", "deprecated"]
# pre-commit passes explicit filenames to ruff, which otherwise ignores
# exclude/extend-exclude for paths given directly on the command line.
force-exclude = true

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Filename matches upstream jtschindler/sculptor for parity tracking; renaming
# it would break that correspondence (see tests/ground_truth/*/Qso_autofit.py).
"sculptor_extensions/src/sculptor_extensions/Qso_autofit.py" = ["N999"]
