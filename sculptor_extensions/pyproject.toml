[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sculptor-extensions"
version = "0.1.0"
description = "Optional QSO-fitting extensions for sculptor"
requires-python = ">=3.13"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "scipy>=1.18.1",
    "sculptor",
]

[tool.uv.sources]
sculptor = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

